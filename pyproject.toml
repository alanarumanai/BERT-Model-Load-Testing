[project]
name = "bert-sentiment-service"
version = "0.1.0"
description = "Sentiment classification API using a pretrained DistilBERT model"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summarise skipped/failed tests at the end. --strict-markers: catch typos.
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: style errors, F: likely bugs (unused imports, undefined names),
# I: import order, B: common bug patterns, UP: modern Python syntax.
select = ["E", "W", "F", "I", "B", "UP"]
